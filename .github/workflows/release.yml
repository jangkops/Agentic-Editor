name: Release

# 태그 푸시(v*) 또는 수동 실행 시 macOS/Windows 빌드 → GitHub Releases 업로드.
# 각 OS 러너에서 PyInstaller 백엔드를 동결한다(크로스컴파일 불가 → matrix 필수).
on:
  push:
    tags:
      - "v*"
  # 수동 실행은 기본적으로 "빌드만"(publish=never) — 릴리스를 만들지 않고 PyInstaller 동결 + electron-builder
  # 파이프라인 자체를 검증한다(산출물은 워크플로 아티팩트로만). 태그 푸시는 항상 GitHub Releases 에 올린다.
  workflow_dispatch:
    inputs:
      publish:
        description: "electron-builder --publish 모드 (never=빌드·아티팩트만, always=GitHub Releases 업로드)"
        type: choice
        default: "never"
        options: ["never", "always"]

permissions:
  contents: write   # 릴리스 자산 업로드에 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node deps (rebuilds node-pty for Electron via postinstall)
        run: npm ci

      # R1.3/R1.6 — 동결 전 필수 모듈 import 게이트.
      # 백엔드 의존성을 설치한 뒤(동결에 쓰는 것과 동일한 인터프리터) 릴리스 필수 4모듈
      # (matplotlib, scipy, langgraph, pptx)이 import 가능한지 확인한다. 검사는 인라인
      # 멀티라인 python -c 대신 커밋된 스크립트(scripts/check_frozen_imports.py)로 수행한다.
      # 하나라도 없으면 스크립트가 누락 모듈명을 출력하고 종료 코드 1로 잡을 즉시 실패시켜
      # 값비싼 PyInstaller 동결 이전에 빌드를 중단한다. macos-latest / windows-latest
      # 두 매트릭스 레그 모두에서 실행된다.
      - name: Verify release-critical Python modules (pre-build import gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai_engine/requirements.txt
          python scripts/check_frozen_imports.py

      # AE_REQUIRE_EMBED_BUNDLE=1: fastembed 모델 사전 번들(다운로드 → 심볼릭 링크 실체화 → 고아 blobs 제거 →
      # HF_HUB_OFFLINE=1 실로드 프로브)이 하나라도 실패하면 빌드를 실패시킨다. 로컬 빌드의 "경고 후 LSA 폴백"을
      # 릴리스에 허용하면 사내망 배포본이 조용히 저품질 검색으로 떨어지고 아무도 모른다(2026-09-22).
      - name: Build Python backend (PyInstaller, frozen onedir)
        env:
          AE_REQUIRE_EMBED_BUNDLE: "1"
        run: npm run build:python

      # R1.4/R1.5 — 동결 백엔드 기동 스모크(스펙 app-deployment-readiness 태스크 12.4). 동결 바이너리를 실제로 띄워
      # 30초 안에 /health 200 을 받고 기능 경로 대표 호출(PPTX 파서·이미지 라우팅·브리지 상태)을 확인한다.
      # 자격증명이 없는 러너라 LLM·다이어그램 경로는 skipped 로 기록되고 판정에 영향이 없다. 진단 엔드포인트
      # 프로브를 위해 AE_DEBUG_ENDPOINTS=1 을 스모크 프로세스에만 준다(배포본 기본값은 잠김). 실패 = 빌드 실패:
      # "동결은 됐는데 기동이 안 되는 산출물"을 패키징 단계로 넘기지 않는다.
      - name: Smoke-test frozen backend (boot ≤30s + feature-path probes)
        shell: bash
        env:
          AE_DEBUG_ENDPOINTS: "1"
          # Windows 러너 콘솔은 cp1252 — 한국어 리포트 출력이 UnicodeEncodeError 로 죽어 통과한 스모크가 exit 1 이
          # 됐다(2026-09-22 첫 실행). 스크립트가 스트림을 UTF-8 로 재설정하고, 인터프리터 단에서도 같은 것을 보장한다.
          PYTHONUTF8: "1"
        run: |
          BIN=ai_engine_dist/ai-engine-server/ai-engine-server
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          python scripts/smoke_frozen_backend.py --target frozen --binary "$BIN"

      # R3.5 — 미서명 폴백 체크(비차단). 서명·공증에 필요한 시크릿이 설정돼 있는지
      # 빌드 스텝 앞에서 확인만 한다. 서명 자산이 없으면 "⚠️ 미서명 빌드" 경고를 남기고
      # 빌드를 그대로 진행한다(실패 아님 — R3.5). 있으면 서명·공증이 활성화됨을 로그로 알린다.
      # GitHub는 시크릿을 마스킹하므로 값 자체가 아니라 env 매핑 후 비어있는지(-z)로 판정한다.
      - name: Check signing assets (unsigned fallback, non-blocking)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "⚠️ 미서명 빌드(서명 자산 미제공)"
            echo "  CSC_LINK 시크릿이 없어 코드서명 없이 빌드를 계속합니다 (R3.5 비차단 폴백)."
          else
            echo "✅ 코드서명 활성화(CSC_LINK 감지됨)"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "✅ 공증 활성화(APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 감지됨)"
            else
              echo "ℹ️ 공증 자산 일부 누락 — 서명은 적용되나 공증은 건너뜁니다."
            fi
          fi

      - name: Build & publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 코드서명: CSC_LINK(인증서 base64/경로) + CSC_KEY_PASSWORD가 있으면
          # electron-builder가 자동 서명한다(R3.3). 별도 코드 불요 — env 존재만으로 동작.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 공증(R3.2): APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID가
          # 있으면 electron-builder가 자동 공증한다. 셋 다 없으면 미서명 빌드로 진행(R3.5).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 태그 푸시 = always(릴리스 업로드). 수동 실행 = inputs.publish(기본 never: 빌드 검증만).
          # 입력은 choice(never|always)로 제한되지만 셸에는 env 로만 전달한다(인젝션 방지 관례).
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'always' }}
        shell: bash
        run: |
          # 시크릿이 없으면 `${{ secrets.X }}` 는 빈 문자열로 주입되는데, electron-builder 는 "정의된" CSC_LINK 를
          # 파일 경로로 해석해 "not a file" 로 빌드를 중단한다(2026-09-17 검증 빌드 실측, mac·win 모두).
          # 값이 없는 서명·공증 변수는 unset 해 진짜 "미서명 빌드"가 되게 하고, macOS 는 키체인 identity 자동 탐색도 끈다.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --${{ matrix.artifact }} --publish "$PUBLISH_MODE"

      # 실측 근거 — 번들된 모델 캐시와 산출물 크기를 로그에 남긴다. 2026-09-22 검증 빌드에서 mac 아티팩트가
      # 이전보다 약 880MB 커졌는데 로그에 크기가 없어 원인(blobs 잔존 vs 이전 빌드의 모델 누락)을 판별하지 못했다.
      - name: Report bundle sizes (model cache · dist_electron)
        if: always()
        shell: bash
        run: |
          echo "== ai_engine_dist/ai-engine-server/fastembed_models =="
          du -sh ai_engine_dist/ai-engine-server/fastembed_models 2>/dev/null || echo "(없음)"
          find ai_engine_dist/ai-engine-server/fastembed_models -mindepth 1 -maxdepth 3 -type d -exec du -sh {} + 2>/dev/null || true
          echo "== ai_engine_dist (전체) =="
          du -sh ai_engine_dist 2>/dev/null || echo "(없음)"
          echo "== dist_electron =="
          ls -la dist_electron 2>/dev/null || echo "(없음)"

      - name: Upload build artifacts (백업)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-editor-${{ matrix.artifact }}
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.AppImage
            dist_electron/latest*.yml
          if-no-files-found: ignore
