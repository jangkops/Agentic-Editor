name: Test

# push / PR 마다 돌아가는 검증 게이트. release.yml(태그 시 빌드·배포)에는 테스트 스텝이 없으므로
# 여기서 (1) Electron 쪽 Jest 전체, (2) 사이드카를 릴리스 CI 와 같은 Python 3.11(및 3.12)에서
# 파싱·import·오프라인 pytest 로 검증한다. 네트워크(fastembed 모델 다운로드)·Chrome 헤드리스가
# 필요한 테스트는 scripts/ci_offline_tests.txt 에서 제외한다(README 9장 참고).
on:
  push:
    branches: ["gamma", "main"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-unit:
    name: Jest (Electron main/renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install (postinstall rebuilds node-pty; failure is non-blocking there)
        run: npm ci
      - name: Syntax check main-process entry points
        run: |
          node --check electron/main.js
          node --check electron/preload.js
      - name: Jest unit tests
        run: npx jest tests/unit/ --coverage=false --ci

  py-sidecar:
    name: Sidecar (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]   # 3.11 = release.yml 동결 인터프리터, 3.12 = 문법 상한 확인
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ai_engine/requirements.txt
      - name: Install backend requirements + test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai_engine/requirements.txt
          python -m pip install pytest hypothesis
      - name: Syntax gate (whole tree must parse on this interpreter)
        run: python -m compileall -q ai_engine scripts
      - name: Release-critical imports (same gate as release.yml)
        run: python scripts/check_frozen_imports.py
      - name: Import smoke — the sidecar module must import on this interpreter
        run: python -c "import ai_engine.server as s; print('ai_engine.server', s.__version__)"
      - name: Offline pytest set
        run: |
          set -o pipefail
          grep -v '^\s*#' scripts/ci_offline_tests.txt | grep -v '^\s*$' | xargs python -m pytest -q -p no:cacheprovider
