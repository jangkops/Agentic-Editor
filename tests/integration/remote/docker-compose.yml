version: '3.8'

services:
  sshd:
    image: linuxserver/openssh-server
    container_name: remote-ssh-test-sshd
    hostname: sshd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=false
      - USER_NAME=testuser
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
    ports:
      - "2222:2222"
    volumes:
      - ./keys:/keys:ro
    networks:
      - ssh-test-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 5s
      timeout: 3s
      retries: 5

  sshd-bastion:
    image: linuxserver/openssh-server
    container_name: remote-ssh-test-bastion
    hostname: sshd-bastion
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=false
      - USER_NAME=testuser
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
    ports:
      - "2223:2222"
    volumes:
      - ./keys:/keys:ro
    networks:
      - ssh-test-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ssh-test-net:
    driver: bridge
